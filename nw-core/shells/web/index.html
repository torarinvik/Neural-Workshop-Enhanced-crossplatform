  if (isTwoHandsTask()) {
    const phase = twoHandsInfo(TWO_HANDS_INFO.phase);
    if (phase === TWO_HANDS_PHASE.ready || phase === TWO_HANDS_PHASE.done ||
        phase === TWO_HANDS_PHASE.scored) {
      twoHandsAction(TWO_HANDS_ACTION.start);
      scheduleTwoHandsAdvance();
    } else if (phase === TWO_HANDS_PHASE.running) {
      twoHandsAction(TWO_HANDS_ACTION.jump);
      scheduleTwoHandsAdvance();
    }
    return;
  }
  if (isOverrunTask()) {
    const phase = overrunInfo(OVERRUN_INFO.phase);
    if (phase === OVERRUN_PHASE.ready || phase === OVERRUN_PHASE.done) {
      overrunAction(OVERRUN_ACTION.start);
      scheduleOverrunAdvance();
    }
    return;
  }
  if (isMarbleTask()) {
    marblePrimary();
    return;
  }
  if (!taskStarted()) { taskStart(); return; }
  if (taskIsAnswerGame()) { taskSubmit(); return; }
  taskState.action = TASK_ACTION.PRIMARY;
  taskState.steps += 1;
  taskState.verdict = -1;
}

function taskClick(event) {
  if (isAlgebraTask()) {
    if (algebraInfo(0) !== 1) algebraAction(0);
    if (algebraInfo(0) === 1) focusAlgebraText();
    draw();
    return;
  }
  if (isCountTask()) return;
  if (isMrTimeTask()) {
    const phase = mrTimeInfo(MR_TIME_INFO.phase);
    if (phase === MR_TIME_PHASE.ready || phase === MR_TIME_PHASE.done) {
      mrTimeAction(MR_TIME_ACTION.start);
    } else if (phase === MR_TIME_PHASE.counting) {
      apiDispatchPointer(ensureMrTimeRun(), API_EVENT.pointerDown, event);
    }
    scheduleMrTimeAdvance();
    draw();
    return;
  }
  if (isTriviaTask()) {
    const phase = triviaInfo(TRIVIA_INFO.phase);
    if (phase === TRIVIA_PHASE.ready || phase === TRIVIA_PHASE.done) {
      triviaAction(TRIVIA_ACTION.start);
    }
    draw();
    return;
  }
  if (isNinaRowTask()) {
    const phase = ninaRowInfo(NINA_INFO.phase);
    if (phase === NINA_PHASE.asking) {
      apiDispatchPointer(ensureNinaRowRun(), API_EVENT.pointerDown, event);
    } else {
      ninaRowAction(NINA_ACTION.start);
    }
    draw();
    return;
  }
  if (isNumberologyTask()) {
    if (numberologyInfo(NUMBEROLOGY_INFO.phase) !== NUMBEROLOGY_PHASE.working) {
      numberologyAction(NUMBEROLOGY_ACTION.start);
      draw();
    }
    return;
  }
  if (isHanoiTask()) {
    const phase = hanoiInfo(HANOI_INFO.phase);
    if (phase !== HANOI_PHASE.solving) return;
    const point = referencePointFromEvent(event);
    const left = REFERENCE_WIDTH * 0.06;
    const width = REFERENCE_WIDTH * 0.88;
    const peg = Math.max(0, Math.min(2,
      Math.floor((point.x - left) * 3 / width)));
    hanoiAction(HANOI_ACTION.pick0 + peg);
    draw();
    return;
  }
  if (isSalesmanTask()) {
    const phase = salesmanInfo(SALESMAN_INFO.phase);
    if (phase === SALESMAN_PHASE.touring) {
      apiDispatchPointer(ensureSalesmanRun(), API_EVENT.pointerDown, event);
    } else if (phase === SALESMAN_PHASE.ready || phase === SALESMAN_PHASE.done) {
      salesmanAction(SALESMAN_ACTION.start);
    }
    scheduleSalesmanAdvance();
    draw();
    return;
  }
  if (isGraphMappingTask()) {
    const phase = graphMappingInfo(GRAPH_MAPPING_INFO.phase);
    if (phase === GRAPH_MAPPING_PHASE.asking || phase === GRAPH_MAPPING_PHASE.hidden) {
      apiDispatchPointer(ensureGraphMappingRun(), API_EVENT.pointerDown, event);
    } else if (phase === GRAPH_MAPPING_PHASE.ready || phase === GRAPH_MAPPING_PHASE.done) {
      graphMappingAction(GRAPH_MAPPING_ACTION.start);
    }
    scheduleGraphMappingAdvance();
    draw();
    return;
  }
  if (isMazeTask()) return;
  if (isFogTask()) {
    if (fogInfo(FOG_INFO.phase) === FOG_PHASE.ready) fogAction(FOG_ACTION.start);
    draw();
    return;
  }
  if (isConcentrationTask()) {
    const phase = concentrationInfo(CONCENTRATION_INFO.phase);
    if (phase === CONCENTRATION_PHASE.playing) {
      apiDispatchPointer(ensureConcentrationRun(), API_EVENT.pointerDown, event);
      scheduleConcentrationAdvance();
    } else if (phase === CONCENTRATION_PHASE.ready || phase === CONCENTRATION_PHASE.done) {
      concentrationAction(CONCENTRATION_ACTION.start);
      scheduleConcentrationAdvance();
    }
    draw();
    return;
  }
  if (isRecognitionTask()) {
    const phase = recognitionInfo(RECOGNITION_INFO.phase);
    if (phase === RECOGNITION_PHASE.showing || phase === RECOGNITION_PHASE.hidden) {
      apiDispatchPointer(ensureRecognitionRun(), API_EVENT.pointerDown, event);
      scheduleRecognitionAdvance();
    } else if (phase === RECOGNITION_PHASE.ready || phase === RECOGNITION_PHASE.done) {
      recognitionAction(RECOGNITION_ACTION.start);
      scheduleRecognitionAdvance();
    }
    draw();
    return;
  }
  if (isRemovalsTask()) {
    const phase = removalsInfo(REMOVALS_INFO.phase);
    if (phase === REMOVALS_PHASE.asking) {
      apiDispatchPointer(ensureRemovalsRun(), API_EVENT.pointerDown, event);
    } else if (phase === REMOVALS_PHASE.ready || phase === REMOVALS_PHASE.done) {
      removalsAction(REMOVALS_ACTION.start);
      scheduleRemovalsAdvance();
    }
    draw();
    return;
  }
  if (isCustodyTask()) {
    const phase = custodyInfo(CUSTODY_INFO.phase);
    if (phase === CUSTODY_PHASE.ready || phase === CUSTODY_PHASE.scored ||
        phase === CUSTODY_PHASE.done) {
      custodyAction(CUSTODY_ACTION.start);
      scheduleCustodyAdvance();
    }
    draw();
    return;
  }
  if (isNCupMonteTask()) {
    const phase = ncupMonteInfo(NCUP_MONTE_INFO.phase);
    if (phase === NCUP_MONTE_PHASE.guess) {
      apiDispatchPointer(ensureNCupMonteRun(), API_EVENT.pointerDown, event);
    } else if (phase === NCUP_MONTE_PHASE.ready || phase === NCUP_MONTE_PHASE.result) {
      ncupMonteAction(NCUP_MONTE_ACTION.start);
      scheduleNCupMonteAdvance();
    }
    draw();
    return;
  }
  if (isReflexTask()) {
    const phase = reflexInfo(REFLEX_INFO.phase);
    if (phase === REFLEX_PHASE.running) {
      apiDispatchPointer(ensureReflexRun(), API_EVENT.pointerDown, event);
      scheduleReflexAdvance();
    } else if (phase === REFLEX_PHASE.ready || phase === REFLEX_PHASE.done) {
      reflexAction(REFLEX_ACTION.start);
      scheduleReflexAdvance();
    }
    draw();
    return;
  }
  if (isMovingTargetsTask()) {
    const phase = movingTargetsInfo(TRACKING_INFO.phase);
    if (phase === TRACKING_PHASE.picking) {
      apiDispatchPointer(ensureMovingTargetsRun(), API_EVENT.pointerDown, event);
      scheduleMovingTargetsAdvance();
    } else if (phase === TRACKING_PHASE.ready || phase === TRACKING_PHASE.done) {
      movingTargetsAction(TRACKING_ACTION.start);
      scheduleMovingTargetsAdvance();
    }
    draw();
    return;
  }
  if (isLookoutTask()) {
    draw();
    return;
  }
  if (isOutOfSightTask()) {
    draw();
    return;
  }
  if (isPursuitTask() || isTwoHandsTask() || isOverrunTask()) {
    draw();
    return;
  }
  if (isMarbleTask()) {
    if (marbleInfo(MARBLE_INFO.phase) === MARBLE_PHASE.ready) taskStart();
    draw();
    return;
  }
  const point = referencePointFromEvent(event);
  if (!taskStarted()) { taskStart(); draw(); return; }
  const column = Math.max(0, Math.min(4, Math.floor(point.x / (REFERENCE_WIDTH / 5))));
  const row = Math.max(0, Math.min(4, Math.floor((REFERENCE_HEIGHT - point.y) / (REFERENCE_HEIGHT / 5))));
  taskState.cursor = row * 5 + column;
  taskState.action = TASK_ACTION.PRIMARY;
  taskState.steps += 1;
  taskState.verdict = -1;
  draw();
}

function marbleReferenceTransform() {
  const scale = Math.min(canvas.width / REFERENCE_WIDTH, canvas.height / REFERENCE_HEIGHT);
  const offsetX = (canvas.width - REFERENCE_WIDTH * scale) / 2;
  const offsetY = (canvas.height - REFERENCE_HEIGHT * scale) / 2;
  ctx.setTransform(scale, 0, 0, -scale, offsetX, canvas.height - offsetY);
  return scale;
}

function marbleText(text, x, y, size, color, align = "center", bold = false,
                    baseline = "middle", fontFamily = '"Courier New", monospace',
                    offsetY = MARBLE_TEXT_OFFSET_Y) {
  if (!text) return;
  ctx.save();
  const scale = Math.min(canvas.width / REFERENCE_WIDTH,
                         canvas.height / REFERENCE_HEIGHT);
  const letterboxX = (canvas.width - REFERENCE_WIDTH * scale) / 2;
  const letterboxY = (canvas.height - REFERENCE_HEIGHT * scale) / 2;
  const pixelX = letterboxX + x * scale;
  const pixelY = canvas.height - letterboxY - (y - offsetY) * scale;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = color;
  ctx.font = `${bold ? "bold " : ""}${size * MARBLE_TEXT_SCALE * scale}px ${fontFamily}`;
  ctx.textAlign = "left";
  ctx.textBaseline = baseline;
  const glyphStrokeWidth = fontFamily.includes("Courier New")
    ? size * MARBLE_TEXT_SCALE * scale * marbleGlyphStrokeRatio(dark() !== 0) : 0;
  fillTextRoundedAdvances(ctx, text, pixelX, pixelY,
    {align,pixelScale:1,strokeWidth:glyphStrokeWidth});
  ctx.restore();
}

function marbleStatusText() {
  const game = marbleGame;
  const state = apiReadState(ensureMarbleRun());
  const phase = Number(state[MARBLE_INFO.phase]);
  const trial = Number(state[MARBLE_INFO.trial]);
  const total = Number(state[MARBLE_INFO.totalTrials]);
  const verdict = Number(state[MARBLE_INFO.verdict]);
  // The native READY phase has no tray or Simulation yet. Keep the browser
  // equally lazy: the first board is dealt and its host physics object is
  // created only after Space is accepted. Status text must still be visible
  // while that pre-run state has no game object.
  if (!game) {
    if (phase === MARBLE_PHASE.ready) return "Press Space to start";
    if (phase === MARBLE_PHASE.preparing) return "Preparing the tray…";
    return phase === MARBLE_PHASE.done ? "Run complete" : "Preparing the run…";
  }
  const home = game.home, lost = game.lost, count = game.marbles.length;
  if (phase === MARBLE_PHASE.done) {
    return `${marbleRunStats.won} trays of ${marbleRunStats.completed}, ` +
      `${marbleRunStats.lostMarbles} marbles lost, highest rung ${marbleRunStats.bestRung}`;
  }
  if (phase === MARBLE_PHASE.ready) return "Press Space to start";
  if (phase === MARBLE_PHASE.feedback) {
    const boardSeconds = marbleBoardBudgetSeconds(game.board, marbleOptions.seconds);
    // The source checks `sim.settled` before checking the deadline. A marble
    // that reaches the cup on the boundary frame is therefore a physical win
    // even when its elapsed clock is equal to or just beyond the configured
    // budget; the verdict, not the clock alone, decides which feedback is
    // shown. This also keeps the separate zero-lost timeout score quirk from
    // turning a physical loss into a false success.
    const feedbackKind = marbleFeedbackKind(game, verdict, boardSeconds);
    if (feedbackKind === "won") {
      const par = game.board.route / 0.25 + 2.5 * count;
      return `Home in ${Math.trunc(game.elapsed)}s — a good line was about ${Math.trunc(par)}s`;
    }
    if (feedbackKind === "timeout") {
      return `Out of time — ${home} of ${count} home`;
    }
    if (feedbackKind === "lost-single") {
      return `Down a hole — ${home} of ${count} home`;
    }
    return `${lost} marbles down a hole`;
  }
  const remaining = Number(state[MARBLE_INFO.remainingMs]);
  const roll = marbleSourceRound(game.roll * 180 / Math.PI);
  const pitch = marbleSourceRound(game.pitch * 180 / Math.PI);
  const rung = Number(state[MARBLE_INFO.rung]);
  const boardSeconds = marbleBoardBudgetSeconds(game.board, marbleOptions.seconds);
  const message = marbleRunMessage ||
    `${MARBLE_GRADES[rung - 1] ?? "the tray"} — ${Math.trunc(boardSeconds)}s`;
  return `${message}     tray ${trial}/${total}   home ${home}/${count}   ${Math.trunc(remaining / 1000)}s left   tilt ${roll}°/${pitch}°`;
}

function drawMarbleMazeFallback() {
  const game = marbleGame;
  if (!game) return;
  const board = game.board;
  marbleReferenceTransform();
  // Leave room for the title, status and original help line. The physical
  // board keeps its dealt aspect ratio at every rung.
  const maxWidth = 700;
  const maxHeight = 380;
  const boardScale = Math.min(maxWidth / board.width, maxHeight / board.depth);
  const boardWidth = board.width * boardScale;
  const boardHeight = board.depth * boardScale;
  const left = (REFERENCE_WIDTH - boardWidth) / 2;
  const bottom = 132 + (maxHeight - boardHeight) / 2;
  const mapX = (x) => left + x * boardScale;
  const mapY = (y) => bottom + y * boardScale;
  const darkTheme = dark() !== 0;
  const wood = darkTheme ? "#9d6e3d" : "#cd9d5d";
  const woodShadow = darkTheme ? "#3c2717" : "#52331c";
  const rail = darkTheme ? "#6d4525" : "#6f4523";
  const floor = darkTheme ? "#94764f" : "#ddbb81";
  const wall = darkTheme ? "#392719" : "#5d3d23";
  const pit = darkTheme ? "#090806" : "#231811";

  ctx.save();
  ctx.fillStyle = woodShadow;
  ctx.fillRect(left + 9, bottom - 10, boardWidth, boardHeight);
  ctx.fillStyle = wood;
  ctx.fillRect(left, bottom, boardWidth, boardHeight);
  ctx.strokeStyle = rail;
  ctx.lineWidth = 8;
  ctx.strokeRect(left, bottom, boardWidth, boardHeight);
  ctx.fillStyle = floor;
  ctx.fillRect(mapX(MARBLE.RADIUS), mapY(MARBLE.RADIUS),
              boardWidth - 2 * MARBLE.RADIUS * boardScale,
              boardHeight - 2 * MARBLE.RADIUS * boardScale);

  ctx.fillStyle = wall;
  for (const segment of board.walls) {
    const x = mapX(segment.x0), y = mapY(segment.y0);
    const width = Math.max(2, (segment.x1 - segment.x0) * boardScale);
    const height = Math.max(2, (segment.y1 - segment.y0) * boardScale);
    ctx.fillRect(x, y, width, height);
  }

  for (const hole of board.holes) {
    ctx.beginPath();
    ctx.fillStyle = hole.home ? "#288f58" : pit;
    ctx.arc(mapX(hole.x), mapY(hole.y), hole.radius * boardScale, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = hole.home ? "#9bdfb1" : "#976a38";
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  for (const marble of game.marbles) {
    if (marble.state !== "rolling" && marble.state !== "falling") continue;
    const radius = MARBLE.RADIUS * boardScale * (marble.state === "falling" ?
      clamp(marble.z / MARBLE.RADIUS, 0.2, 1) : 1);
    const x = mapX(marble.x), y = mapY(marble.y);
    ctx.globalAlpha = marble.state === "falling" ? 0.7 : 1;
    ctx.fillStyle = "rgba(70, 80, 92, .65)";
    ctx.beginPath();
    ctx.arc(x + 3, y - 4, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#ecf1f8";
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#798696";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // Carry a small painted mark with the simulated sphere. The mark is the
    // 2D projection of the local +x direction after the browser solver's
    // quaternion rotation, so a wall skid and a clean roll are visibly
    // different rather than only different in hidden state.
    const markX = 1 - 2 * (marble.qy * marble.qy + marble.qz * marble.qz);
    const markY = 2 * (marble.qx * marble.qy + marble.qw * marble.qz);
    ctx.fillStyle = "#4b79b7";
    ctx.beginPath();
    ctx.arc(x + markX * radius * 0.52, y + markY * radius * 0.52,
            Math.max(1.5, radius * 0.16), 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  const runPhase = marbleInfo(MARBLE_INFO.phase);
  const runVerdict = marbleInfo(MARBLE_INFO.verdict);
  marbleReferenceTransform();
  marbleText(marbleStatusText(), REFERENCE_WIDTH / 2, REFERENCE_HEIGHT - 62, 14,
             darkTheme ? "#e8ebf0" : "#20242a", "center", false, "top");
  if (runPhase === MARBLE_PHASE.feedback) {
    marbleText(marbleStatusText(), REFERENCE_WIDTH / 2, 60, 16,
               runVerdict === 1 ? "#246b3f" : "#9a3030", "center", true);
  }
}

function drawMarbleMaze() {
  const game = marbleGame;
  // The Elisa scene owns title/help chrome, but its Marble scene is a static
  // board-less placeholder. The browser supplies dynamic READY/running text
  // and the live board frame from the controller and physics state.
  if (game) {
    drawMarbleMazeFrame(game);
  } else {
    marbleReferenceTransform();
    marbleText(marbleStatusText(), REFERENCE_WIDTH / 2,
      REFERENCE_HEIGHT - 62, 14, dark() ? "#e8ebf0" : "#20242a",
      "center", false, "top");
  }
}

function drawMarbleMazeFrame(game) {
  const darkTheme = dark() !== 0;
  const state = apiReadState(ensureMarbleRun());
  const phase = Number(state[MARBLE_INFO.phase]);
  if (marbleRenderer && phase !== MARBLE_PHASE.ready && phase !== MARBLE_PHASE.preparing) {
    try {
      const image = marbleRenderer.render(game, {
        width: canvas.width, height: canvas.height, dark: darkTheme,
        logicalWidth: fittedLogicalWidth, logicalHeight: fittedLogicalHeight,
        shadows: marbleOptions.shadows,
        grainSeed: Number(exports.nw_api_v1_marble_grain_seed(BigInt(ensureMarbleRun()))),
      });
      if (image && marbleRenderer.viewport) {
        const { x, y, width, height } = marbleRenderer.viewport;
        // Composite only the GL stage. The source renderer owns the chrome,
        // and drawing the whole opaque WebGL backing canvas would erase it.
        // These viewport values are framebuffer pixels, whereas the display
        // list leaves ctx in reference-space (scaled and Y-flipped). Reset to
        // backing-store coordinates or DPR>1 moves/scales the stage out of
        // alignment with its source-rendered chrome.
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.drawImage(image, x, y, width, height, x, y, width, height);
        ctx.restore();
      }
    } catch (error) {
      marbleRendererError = error?.message ?? String(error);
      console.error("Marble Maze 3D frame failed", error);
      marbleRenderer.dispose();
      marbleRenderer = null;
    }
  } else if (phase !== MARBLE_PHASE.ready && phase !== MARBLE_PHASE.preparing) {
    drawMarbleMazeFallback();
    return;
  }

  // The Elisa frame owns the static title/help and verdict band, but its
  // browser task-frame adapter cannot see host-owned physics feedback. Keep
  // the live status line above the 3D stage in the WebGL path just as the 2D
  // fallback does; the verdict band itself is already supplied by Elisa.
  marbleReferenceTransform();
  marbleText(marbleStatusText(), REFERENCE_WIDTH / 2,
    REFERENCE_HEIGHT - 62, 14, darkTheme ? "#e8ebf0" : "#20242a",
    "center", false, "top");
  // The original Marble UI keeps its verdict label in the feedback band
  // below the board as well as the live status line above it. The static
  // board-less Elisa scene cannot see the host-owned MuJoCo outcome, so paint
  // that dynamic label here using the same verdict colour and layout slot.
  if (phase === MARBLE_PHASE.feedback) {
    const verdict = Number(state[MARBLE_INFO.verdict]);
    marbleText(marbleStatusText(), REFERENCE_WIDTH / 2, 60, 17,
      verdict === 1 ? "#40ff40" : "#ff4040", "center", false,
      "middle", "system-ui, sans-serif", 1);
  }

}

// The native Marble Maze binds F11 to display.toggle_fullscreen(). Browsers
// normally reserve F11 for their own chrome, but some embedded/browser-hosted
// surfaces deliver it to the page. Keep the source shortcut when it is
// delivered, while treating a denied or unsupported Fullscreen API as a
// normal capability difference rather than an uncaught task error.
async function toggleMarbleFullscreen() {
  try {
    if (document.fullscreenElement) {
      if (typeof document.exitFullscreen === "function") {
        await document.exitFullscreen();
      }
    } else if (document.fullscreenEnabled &&
               typeof document.documentElement.requestFullscreen === "function") {
      await document.documentElement.requestFullscreen();
    }
  } catch (error) {
    // F11 is browser-owned on many platforms, and a page may also be
    // embedded without fullscreen permission. Neither should make Marble
    // stop responding or produce an unhandled rejection.
    console.warn("Marble Maze fullscreen request was unavailable", error);
  }
}

function startMonkeyRound(keyEvent = null) {

    : monkeyAction(MONKEY_ACTION.start);

function scheduleMonkeyAdvance(handle) {
  const deadline = monkeyInfo(MONKEY_INFO.deadlineMs);
  const remaining = Math.max(0, deadline - Math.floor(performance.now()) + 1);
  monkeyTimer = setTimeout(() => {
    monkeyTimer = null;
    if (screen !== "monkey" || handle !== monkeyRunHandle) return;
    apiAdvance(handle);
    if (monkeyInfo(MONKEY_INFO.phase) === MONKEY_PHASE.show) {
      scheduleMonkeyAdvance(handle);

    draw();
  }, remaining);
}

function referencePointFromEvent(event) {
  const rect = canvas.getBoundingClientRect();
  const px = (event.clientX - rect.left) * canvas.width / rect.width;
  const py = (rect.bottom - event.clientY) * canvas.height / rect.height;
  const scale = Math.min(canvas.width / REFERENCE_WIDTH, canvas.height / REFERENCE_HEIGHT);
  const offsetX = (canvas.width - REFERENCE_WIDTH * scale) / 2;
  const offsetY = (canvas.height - REFERENCE_HEIGHT * scale) / 2;
  return { x: (px - offsetX) / scale, y: (py - offsetY) / scale };
}

function taskhubHitFromEvent(event) {
  const { x, y } = referencePointFromEvent(event);
  const width = REFERENCE_WIDTH;
  const height = REFERENCE_HEIGHT;
  const count = TASK_CATEGORIES.length;
  const gutter = Math.max(48, Math.trunc(width * 0.08));
  const gap = Math.max(10, Math.trunc(width * 0.012));
  const tabWidth = Math.trunc((width - 2 * gutter - gap * (count - 1)) / count);
  const totalWidth = count * tabWidth + (count - 1) * gap;
  const startX = Math.trunc((width - totalWidth) / 2);
  const tabHeight = Math.max(48, Math.trunc(36));
  const tabY = height - 128;
  if (y >= tabY - tabHeight / 2 && y <= tabY + tabHeight / 2) {
    const index = Math.floor((x - startX) / (tabWidth + gap));
    const tabX = startX + index * (tabWidth + gap);
    if (index >= 0 && index < count && x >= tabX && x <= tabX + tabWidth) {
      return { kind: "category", index };
    }
  }

  const tasks = TASK_CATEGORIES[taskCategory].tasks.length;
  const rows = Math.ceil(tasks / 3);
  const gridWidth = Math.min(width - 2 * gutter, Math.trunc(width * 0.68));
  const cardGapX = Math.max(10, Math.trunc(width * 0.012));
  const cardWidth = Math.trunc((gridWidth - cardGapX * 2) / 3);
  const actualGridWidth = 3 * cardWidth + 2 * cardGapX;
  const gridX = Math.trunc((width - actualGridWidth) / 2);
  const top = height - 215;
  const bottom = 72;
  const cardGapY = Math.max(8, Math.min(18, Math.trunc(height * 0.015)));
  const available = Math.max(1, top - bottom - cardGapY * (rows - 1));
  const preferredHeight = Math.max(52, Math.min(100, Math.trunc(height * 0.095)));
  const cardHeight = Math.max(36, Math.min(preferredHeight, Math.trunc(available / rows)));
  for (let index = 0; index < tasks; index++) {
    const row = Math.floor(index / 3);
    const column = index % 3;
    const cardX = gridX + column * (cardWidth + cardGapX);
    const cardY = top - row * (cardHeight + cardGapY);
    if (x >= cardX && x <= cardX + cardWidth &&
        y >= cardY - cardHeight / 2 && y <= cardY + cardHeight / 2) {
      return { kind: "task", index };
    }
  }
  return null;
}

function advance() {
  if (screen === "taskhub") { moveTask(1); draw(); return; }
  if (screen === "task" && isMatrixReasoningTask()) {
    const phase = matrixReasoningInfo(MATRIX_REASONING_INFO.phase);
    if (phase === MATRIX_REASONING_PHASE.ready || phase === MATRIX_REASONING_PHASE.done) {
      taskPrimary();
    } else {
      apiAdvance(ensureMatrixReasoningRun());
    }
    draw();
    scheduleMatrixReasoningAdvance();
    return;
  }
  if (screen === "task" && isJigsawTask()) {
    canvas.focus();
    const phase = jigsawInfo(JIGSAW_INFO.phase);
    if (phase === JIGSAW_PHASE.ready || phase === JIGSAW_PHASE.done) {
      taskPrimary();
    } else {
      jigsawAction(JIGSAW_ACTION.tick);
      scheduleJigsawAdvance();
    }
    draw();
    return;
  }
  if (screen === "task" && isGoWinningMoveTask()) {
    canvas.focus();
    apiDispatchPointer(ensureGoWinningMoveRun(), API_EVENT.pointerDown, event);
    draw();
    return;
  }
  if (screen === "task" && isTwoHandsTask()) {
    const phase = twoHandsInfo(TWO_HANDS_INFO.phase);
    if (phase === TWO_HANDS_PHASE.ready || phase === TWO_HANDS_PHASE.done ||
        phase === TWO_HANDS_PHASE.scored) {
      taskPrimary();
      draw();
    } else {
      apiAdvance(ensureTwoHandsRun());
      draw();
