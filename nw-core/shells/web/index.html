<!doctype html>
<meta charset="utf-8">
<title>Neural Workshop — web shell</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #14161a; color: #d8dbe0;
    font: 14px/1.5 system-ui, sans-serif;
  }
  main { display: grid; gap: 12px; justify-items: center; }
  canvas { background: #000; border-radius: 6px; max-width: 100%; }
  .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: center; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px;
           border: 1px solid #3a3f47; background: #1e2229; color: inherit; cursor: pointer; }
  button:hover { background: #262b33; }
  code { color: #9aa4b2; }
</style>
<main>
  <canvas id="screen" width="912" height="684"></canvas>
  <div class="row">
    <button id="screen-title">Title</button>
    <button id="screen-menu">Menu</button>
    <button id="screen-nback">N-back</button>
    <button id="step">Next</button>
    <button id="play">Play</button>
    <label><input type="checkbox" id="dark"> dark theme</label>
    <span id="status"><code>loading…</code></span>
  </div>
</main>
<script type="module">
import { instantiateElisa } from "./elisa-wasm-runtime.js";
import { decode, render, REFERENCE_WIDTH, REFERENCE_HEIGHT } from "./display-list.js";

const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");

// The whole game core: one wasm module, no other dependency.
const response = await fetch("../../build/nwcore.wasm");
const { exports, instance } = await instantiateElisa(await response.arrayBuffer(), { warn: false });

// One buffer for every frame; the core writes into it and we view it in place.
const FRAME_CAPACITY = 65536;
const framePtr = Number(exports.nw_frame_alloc(BigInt(FRAME_CAPACITY)));

function view(length) {
  // A fresh view each time: memory.grow() can detach the old buffer.
  return new Uint8Array(instance.exports.memory.buffer, framePtr, length);
}

function titleFrame(black) {
  return view(Number(exports.nw_title_write(
    BigInt(framePtr), BigInt(FRAME_CAPACITY), 1n, BigInt(black), 0n, 0n)));
}

function menuFrame(selpos, black) {
  return view(Number(exports.nw_menu_write(
    BigInt(framePtr), BigInt(FRAME_CAPACITY), BigInt(selpos), BigInt(black))));
}

function frame(trial, nback, position, verdict) {
  const length = Number(exports.nw_frame_write(
    BigInt(framePtr), BigInt(FRAME_CAPACITY),
    BigInt(trial), BigInt(nback), BigInt(position), BigInt(verdict)));
  // A fresh view each frame: memory.grow() can detach the old buffer.
  return new Uint8Array(instance.exports.memory.buffer, framePtr, length);
}

// The wasm32 darray-per-call bug that used to garble pooled strings from the
// second frame onward is FIXED: the title screen, which is almost entirely
// text, is byte-identical across repeated calls.
window.__nw = { exports, instance, framePtr, frame };

function fit() {
  const ratio = window.devicePixelRatio || 1;
  const width = Math.min(window.innerWidth - 32, 912);
  const height = width * (REFERENCE_HEIGHT / REFERENCE_WIDTH);
  canvas.style.width = `${width}px`;
  canvas.style.height = `${height}px`;
  canvas.width = Math.round(width * ratio);
  canvas.height = Math.round(height * ratio);
}

let trial = 1;
let position = 4;
let verdict = -1;
let screen = "title";
let selpos = 0;
const MENU_ROWS = 24;

function dark() { return document.getElementById("dark").checked ? 1 : 0; }

function draw() {
  let bytes, note;
  if (screen === "title") {
    bytes = titleFrame(dark());
    note = "title screen";
  } else if (screen === "menu") {
    bytes = menuFrame(selpos, dark());
    note = `menu · row ${selpos}/${MENU_ROWS - 1}`;
  } else {
    bytes = frame(trial, 2, position, verdict);
    note = `trial ${trial} · position ${position}`;
  }
  const commands = decode(bytes);
  const events = render(ctx, commands, { width: canvas.width, height: canvas.height });
  if (screen === "nback") {
    const verdictName = ["correct", "incorrect", "missed", "unknown"][events.verdict] ?? "none";
    note += ` · verdict ${verdictName}`;
  }
  status.innerHTML = `<code>${note} · ${commands.length} commands</code>`;
}

function advance() {
  if (screen === "menu") { selpos = (selpos + 1) % MENU_ROWS; draw(); return; }
  if (screen === "title") { draw(); return; }
  trial += 1;
  // A deterministic walk so the page shows the board changing without needing
  // the session engine wired up yet.
  position = 1 + ((position * 3 + trial) % 8);
  verdict = trial % 4 === 0 ? -1 : (trial % 3);
  draw();
}

for (const name of ["title", "menu", "nback"]) {
  document.getElementById(`screen-${name}`).addEventListener("click", () => {
    screen = name;
    draw();
  });
}
document.getElementById("dark").addEventListener("change", draw);
document.getElementById("step").addEventListener("click", advance);
let timer = null;
document.getElementById("play").addEventListener("click", (event) => {
  if (timer) { clearInterval(timer); timer = null; event.target.textContent = "Play"; }
  else { timer = setInterval(advance, 700); event.target.textContent = "Pause"; }
});
window.addEventListener("resize", () => { fit(); draw(); });

fit();
draw();
</script>
